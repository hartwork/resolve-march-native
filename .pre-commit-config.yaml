exclude: '^resolve_march_native/_gcc/test/data/'

repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: f22ea0651f4355c655cc581f67813c991c74a312  # frozen: v3.22.0
    hooks:
      - id: pyupgrade
        args: ['--py311-plus']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/PyCQA/flake8
    rev: 7eccf20b526fe4f2230bf9afeeef2fc9f97faf8d  # frozen: 7.4.1
    hooks:
      - id: flake8

  - repo: https://github.com/pycqa/isort
    rev: 9f905615631c545f5aea2516508109350d1d2f7d  # frozen: 9.0.2
    hooks:
      - id: isort
